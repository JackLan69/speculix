// ═══════════════════════════════════════════════════════════════════════
// IMAGE UPLOAD HANDLING
// ═══════════════════════════════════════════════════════════════════════
function handleImageUpload(event){
  const file=event.target.files[0];
  if(!file) return;
  // Resize and convert to base64 to keep things fast
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      // Resize if too large (max 1500px on longest side)
      const maxDim=1500;
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
        else{w=Math.round(w*maxDim/h);h=maxDim;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const base64=canvas.toDataURL('image/jpeg',0.85).split(',')[1];
      pendingImage={
        data:base64,
        mediaType:'image/jpeg',
        thumbnail:canvas.toDataURL('image/jpeg',0.5)
      };
      // Show preview
      const bar=document.getElementById('image-preview-bar');
      const thumb=document.getElementById('preview-thumb');
      thumb.src=pendingImage.thumbnail;
      bar.style.display='block';
      // Auto-fill input if empty
      const inp=document.getElementById('input');
      if(!inp.value.trim()){
        inp.value='What does this Speculix screenshot tell you? What should I do?';
      }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value=''; // reset so same file can be uploaded again
}

function clearImage(){
  pendingImage=null;
  document.getElementById('image-preview-bar').style.display='none';
}

function addMessage(role,content,isHTML=false){
  const chat=document.getElementById('chat');
  const msg=document.createElement('div');
  msg.className='msg '+role;
  if(isHTML) msg.innerHTML=content;
  else msg.textContent=content;
  chat.appendChild(msg);
  chat.scrollTop=chat.scrollHeight;
  
  if(role!=='system'){
    messageCount++;
    document.getElementById('message-count').textContent=messageCount+' messages';
  }
}

function addQuickReplies(replies){
  const chat=document.getElementById('chat');
  const container=document.createElement('div');
  container.className='quick-replies';
  container.style.alignSelf='flex-start';
  container.style.maxWidth='90%';

    btn.onclick=()=>{

      document.getElementById('input').value=r;
      sendMessage();
    };
    container.appendChild(btn);
  });
  chat.appendChild(container);
  chat.scrollTop=chat.scrollHeight;
}

function showThinking(){

  t.className='thinking';
  t.id='thinking-indicator';
  t.innerHTML='<div></div><div></div><div></div>';
  chat.appendChild(t);
  chat.scrollTop=chat.scrollHeight;
}

function hideThinking(){
  const t=document.getElementById('thinking-indicator');
  if(t) t.remove();
}

// ═══════════════════════════════════════════════════════════════════════
// CLAUDE API CALL
// ═══════════════════════════════════════════════════════════════════════
async function callClaude(userMessage,imageData){
  // Build content — text only, or text + image
  let userContent;
  if(imageData){
    userContent=[
      {type:'image',source:{type:'base64',media_type:imageData.mediaType,data:imageData.data}},
      {type:'text',text:userMessage||'What do you see in this screenshot? What should I do next?'}
    ];
  } else {
    userContent=userMessage;
  }
  
  conversationHistory.push({role:'user',content:userContent});
  showThinking();
  
  try{
    const response=await fetch(CLAUDE_API_URL,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':CLAUDE_API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:CLAUDE_MODEL,
        max_tokens:800,
        system:PROJECT_CONTEXT,
        messages:conversationHistory
      })
    });
    
    hideThinking();
    
    if(!response.ok){
      const errText=await response.text();
      addMessage('system','⚠ API Error '+response.status+': '+errText.substring(0,200)+'\n\nFIX: Edit strategist.html and replace CLAUDE_API_KEY with your real Claude API key from console.anthropic.com');
      return;
    }
    
    const data=await response.json();
    const reply=data.content[0].text;
    conversationHistory.push({role:'assistant',content:reply});
    addMessage('bot',reply);
    
    // Auto-extract suggested replies if Claude offers options
    extractQuickReplies(reply);
    
  }catch(err){
    hideThinking();
    addMessage('system','⚠ Connection error: '+err.message+'\n\nMake sure your Claude API key is set in strategist.html');
  }
}

function extractQuickReplies(text){
  // Look for numbered options like "1. ..." or "A) ..." in Claude's response
  const patterns=[
    /^[A-D]\)\s*([^\n]{5,80})/gm,
    /^[1-5]\.\s*([^\n]{5,80})/gm,
    /^[1-5]\)\s*([^\n]{5,80})/gm
  ];
  const found=[];
  for(const p of patterns){
    let m;
    while((m=p.exec(text))!==null&&found.length<4){
      const r=m[1].trim().replace(/[*_`]/g,'');
      if(r.length<80&&!found.includes(r)) found.push(r);
    }
    if(found.length>=2) break;
  }
  if(found.length>=2){
    addQuickReplies(found);
  }
}

async function sendMessage(){

    addMessage('user',html,true);
    const imgToSend=pendingImage;
    clearImage();
    await callClaude(msg,imgToSend);
  } else {
    addMessage('user',msg);
    await callClaude(msg);
  }
}

  if(!confirm('Reset conversation? Your message history will be cleared.')) return;
  conversationHistory=[];
  messageCount=0;
  document.getElementById('chat').innerHTML='';
  document.getElementById('message-count').textContent='0 messages';
  startConversation();
}
